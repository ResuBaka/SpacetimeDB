[package]
name = "spacetimedb-sdk"
version.workspace = true
edition.workspace = true
license-file = "LICENSE"
description = "A Rust SDK for clients to interface with SpacetimeDB"
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["client-cache"]
client-cache = ["dep:anymap3"]
# Preserve raw row bytes for cacheless consumers that inspect WithBsatn::bsatn.
# The client cache always retains them, regardless of this feature.
retain-row-bytes = []
# Experimental owned decoder; intentionally not enabled by default.
streaming-decompression = []
allow_loopback_http_for_tests = ["spacetimedb-testing/allow_loopback_http_for_tests"]
browser = [
    "dep:getrandom",
    "dep:gloo-console",
    "dep:gloo-net",
    "dep:gloo-storage",
    "dep:gloo-utils",
    "dep:js-sys",
    "dep:tokio-tungstenite-wasm",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:web-sys",
]

[dependencies]
spacetimedb-data-structures.workspace = true
spacetimedb-sats.workspace = true
spacetimedb-lib = { workspace = true, features = ["serde", "metrics_impls"]}
spacetimedb-client-api-messages.workspace = true
spacetimedb-metrics.workspace = true
spacetimedb-query-builder.workspace = true

thiserror.workspace = true
anymap3 = { version = "1.0.1", optional = true }
brotli.workspace = true
bytes.workspace = true
flate2.workspace = true
futures.workspace = true
# try_recv() replaces the deprecated try_next() API.
futures-channel = "0.3.34"
http.workspace = true
log.workspace = true
once_cell.workspace = true
prometheus.workspace = true

getrandom = { version = "0.3.4", features = ["wasm_js"], optional = true }
gloo-console = { version = "0.3.0", optional = true }
gloo-net = { version = "0.6.0", optional = true }
gloo-storage = { version = "0.3.0", optional = true }
gloo-utils = { version = "0.2.0", optional = true }
js-sys = { version = "0.3", optional = true }
tokio-tungstenite-wasm = { version = "0.6.0", optional = true }
wasm-bindgen = { version = "0.2.100", optional = true }
wasm-bindgen-futures = { version = "0.4.45", optional = true }
web-sys = { version = "0.3.77", features = ["HtmlDocument"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
home.workspace = true
tokio.workspace = true
tokio-websockets.workspace = true

[dev-dependencies]
futures-channel = "0.3.34"
shlex = "1.3.0"
tokio = { workspace = true, features = ["test-util"] }

# for tests
spacetimedb-testing = { path = "../../crates/testing" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
# Native-only experimental benchmark; not linked into the SDK itself.
zstd = "0.13.3"
lz4_flex.workspace = true

[lints]
workspace = true

[[bench]]
name = "streaming_decompression"
harness = false
required-features = ["streaming-decompression"]

[[test]]
name = "streaming_decompression"
path = "benches/streaming_decompression/tests.rs"
required-features = ["streaming-decompression"]
